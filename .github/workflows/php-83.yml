name: php-83

on:
  push:
    branches: [ "main" ]
    paths:
      - 'php8.3/**'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ${{ secrets.REGISTRY_USERNAME }}/php
  PHP_VERSION: "8.3"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: clone code
        uses: actions/checkout@v4

      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: php${{ env.PHP_VERSION }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }}-${{ matrix.arch }}

  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: merge
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }} \
            ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }}-arm64

      - name: docker rmi tool
        uses: imjasonh/setup-crane@v0.4

      - name: docker rmi
        run: |
          crane auth login docker.io -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
          crane delete ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }}-amd64 || echo "Failed to delete amd64 tag"
          crane delete ${{ env.REGISTRY_IMAGE }}:${{ env.PHP_VERSION }}-arm64 || echo "Failed to delete arm64 tag"