name: Build Native Multi-Arch PHP Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'php8.5/**'
  workflow_dispatch:

env:
  # 定义你的镜像名称前缀
  # 注意：如果你推送到官方 Docker Hub，无需前缀，请直接修改为：REGISTRY_IMAGE: wuruiwm/php
  REGISTRY_IMAGE: ${{ secrets.DOCKER_REGISTER_HOST }}/wuruiwm/php

jobs:
  # ==========================================
  # 阶段 1：原生并行构建并推送带有架构后缀的镜像
  # ==========================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 架构使用标准 x86 机器
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          # ARM64 架构使用 GitHub 原生 ARM 机器
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    # 动态分配给对应的物理架构机器
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 此时不再需要 QEMU，因为是真正的对应架构机器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTER_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push by architecture
        uses: docker/build-push-action@v5
        with:
          context: .
          file: php8.5/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # 为不同架构打上临时标签，例如：php:8.5-amd64 和 php:8.5-arm64
          tags: ${{ env.REGISTRY_IMAGE }}:8.6-${{ matrix.arch }}
          # 缓存作用域按架构隔离，避免两种架构的缓存相互覆盖
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  # ==========================================
  # 阶段 2：将两个特定架构的镜像合并为一个多架构镜像
  # ==========================================
  merge:
    runs-on: ubuntu-latest
    needs: build # 必须等待 build 阶段中的两个任务都成功完成

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTER_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 使用 imagetools 直接在云端合并 Manifest，不需要把镜像重新拉取到本地
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:8.6 \
            ${{ env.REGISTRY_IMAGE }}:8.6-amd64 \
            ${{ env.REGISTRY_IMAGE }}:8.6-arm64